services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: riwi-chat-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: riwi-chat-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: OPENAI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: "*"

databases:
  # 2. Managed PostgreSQL with Vector Support
  - name: riwi-chat-postgres
    databaseName: bd_santiago_munoz_nakamoto
    user: rw_app_role
    plan: free
    ipAllowList: []
